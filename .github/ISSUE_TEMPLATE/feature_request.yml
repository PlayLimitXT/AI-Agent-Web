name: Feature request
description: 提出一个新功能或改进建议
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先说明要解决的问题，再描述你期望的方案。
        较大的架构调整请先讨论，避免在未达成一致前投入实现。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到重复建议
          required: true
        - label: 这个建议符合项目的纯前端、零构建边界
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？谁会受影响？
      placeholder: 我在 … 场景下需要 …，但现在的行为是 …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你希望看到的行为或界面。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有更小或更简单的做法？

  - type: dropdown
    id: area
    attributes:
      label: 涉及领域
      multiple: true
      options:
        - 对话与分支
        - 供应商与模型
        - 上下文与记忆
        - 工具 / 搜索 / MCP
        - 渲染与导出
        - 外观与可访问性
        - PWA / 离线
        - 文档 / 仓库
        - 其他

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、草图、相关链接或兼容性要求。

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交实现 PR
        - label: 我可以帮助测试